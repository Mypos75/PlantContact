<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voedselbos Okkerheide — Praat met de Planten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #070f06;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

#app {
  background: #0d1a0f;
  color: #e8f0e2;
  border-radius: 18px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 210px 1fr;
  grid-template-rows: auto 1fr;
  width: 100%;
  max-width: 820px;
  height: 680px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}

#header {
  grid-column: 1 / -1;
  padding: 16px 22px 13px;
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
  background: #09120a;
  display: flex;
  align-items: baseline;
  gap: 14px;
}

#header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 400;
  color: #b8d4a0;
  letter-spacing: 0.01em;
}

#header span { font-size: 12px; color: #3a5030; }



/* SIDEBAR */
#sidebar {
  border-right: 0.5px solid rgba(255,255,255,0.07);
  background: #0a1409;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  grid-row: 2;
}

#lang-row { display: flex; gap: 4px; padding: 10px 10px 6px; }

.lang-btn {
  font-size: 11px; padding: 2px 8px; border-radius: 5px;
  border: 0.5px solid rgba(255,255,255,0.1); background: transparent;
  color: #4a6040; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
}
.lang-btn.active { background: rgba(100,180,60,0.15); border-color: rgba(120,190,70,0.25); color: #9ac870; }

#search {
  margin: 0 10px 8px;
  background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 7px; color: #e8f0e2; font-size: 12px; padding: 6px 9px;
  font-family: 'DM Sans', sans-serif; outline: none; width: calc(100% - 20px);
}
#search::placeholder { color: #3a5030; }
#search:focus { border-color: rgba(140,200,100,0.25); }

#plant-list { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #2a3a22 transparent; }

.plant-item {
  padding: 8px 12px; cursor: pointer;
  border-bottom: 0.5px solid rgba(255,255,255,0.03); transition: background 0.12s;
}
.plant-item:hover { background: rgba(255,255,255,0.04); }
.plant-item.active { background: rgba(100,180,60,0.12); border-left: 2px solid #7ab84a; }
.plant-nl { font-size: 12px; color: #c8ddb8; line-height: 1.3; }
.plant-lat { font-size: 10px; color: #3a5030; font-style: italic; margin-top: 1px; }

/* CHAT */
#chat-panel {
  display: flex; flex-direction: column; overflow: hidden;
  grid-row: 2; background: #0d1a0f;
}

#plant-bar {
  padding: 12px 20px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.06);
  background: #0b160a; min-height: 54px; display: flex; flex-direction: column; justify-content: center;
}
#plant-name { font-family: 'Playfair Display', serif; font-size: 17px; color: #2a3a22; font-style: italic; }
#plant-latin { font-size: 11px; color: #3a5030; font-style: italic; margin-top: 2px; }

#empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; color: #2a3a22; font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 15px; line-height: 2; padding: 30px;
}

#messages {
  flex: 1; overflow-y: auto; padding: 18px 20px;
  display: none; flex-direction: column; gap: 13px;
  scrollbar-width: thin; scrollbar-color: #2a3a22 transparent;
}

.msg-plant {
  align-self: flex-start; max-width: 88%;
  background: rgba(70,130,35,0.13); border: 0.5px solid rgba(110,180,60,0.18);
  border-radius: 3px 14px 14px 14px; padding: 11px 15px;
}
.msg-plant .who {
  font-size: 10px; color: #6aab3a; font-weight: 500;
  margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase;
}
.msg-plant .text {
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: 15px; line-height: 1.7; color: #c8ddb8;
}

.msg-user {
  align-self: flex-end; max-width: 72%;
  background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.09);
  border-radius: 14px 14px 3px 14px; padding: 10px 14px;
  font-size: 14px; color: #d8e8c8; line-height: 1.5;
}

.msg-loading {
  align-self: flex-start; font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 13px; color: #3a5a28; padding: 4px 0;
}
.dots span { animation: blink 1.4s infinite; opacity: 0; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

#input-row {
  padding: 12px 14px; border-top: 0.5px solid rgba(255,255,255,0.06);
  background: #0a1409; display: flex; gap: 8px; align-items: flex-end;
}

#user-input {
  flex: 1; background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 9px; color: #e8f0e2; font-size: 14px; padding: 9px 13px;
  font-family: 'DM Sans', sans-serif; outline: none; resize: none;
  min-height: 40px; max-height: 90px; line-height: 1.5;
}
#user-input::placeholder { color: #2e4226; }
#user-input:focus { border-color: rgba(120,190,60,0.3); }

#send-btn {
  background: #3d7a22; border: none; border-radius: 9px; color: #d8f0c0;
  width: 40px; height: 40px; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
#send-btn:hover { background: #4d8e2e; }
#send-btn:disabled { background: #1e2e16; cursor: not-allowed; color: #3a5030; }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>Voedselbos Okkerheide</h1>
    <span>Praat met de planten · 110 soorten · Merenwijk, Leiden</span>
  </div>

  <div id="sidebar">
    <div id="lang-row">
      <button class="lang-btn active" onclick="setLang('nl',this)">NL</button>
      <button class="lang-btn" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('de',this)">DE</button>
    </div>
    <input id="search" type="text" placeholder="Zoek plant..." oninput="filterPlants(this.value)" />
    <div id="plant-list"></div>
  </div>

  <div id="chat-panel">
    <div id="plant-bar">
      <div id="plant-name">Kies een plant uit de lijst →</div>
      <div id="plant-latin"></div>
    </div>
    <div id="empty">Kies een plant links<br>en stel je vraag hieronder</div>
    <div id="messages"></div>
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Stel je vraag aan de plant..." onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMsg()" title="Versturen">&#9658;</button>
    </div>
  </div>
</div>

<script>
const PLANTS = [
  {lat:"Acer campestre",nl:"Spaanse aak, Veldesdoorn"},{lat:"Acer saccharum",nl:"Suikeresdoorn"},
  {lat:"Actinidia arguta",nl:"Kiwibes"},{lat:"Actinidia deliciosa",nl:"Kiwi"},
  {lat:"Akebia quinata",nl:"Schijnaugurk"},{lat:"Alnus glutinosa",nl:"Zwarte els"},
  {lat:"Amelanchier alnifolia",nl:"Amerikaans krentenboompje"},{lat:"Amelanchier laevis",nl:"Drents krentenboompje"},
  {lat:"Arbutus unedo",nl:"Aardbeiboom"},{lat:"Aronia melanocarpa",nl:"Zwarte appelbes"},
  {lat:"Aronia prunifolia",nl:"Appelbes"},{lat:"Asimina triloba",nl:"Pawpaw, Roomappel"},
  {lat:"Betula spp.",nl:"Berk"},{lat:"Caragana arborescens",nl:"Siberische erwtenstruik"},
  {lat:"Castanea sativa",nl:"Tamme kastanje"},{lat:"Chaenomeles cathayensis",nl:"Chinese kwee"},
  {lat:"Chaenomeles japonica",nl:"Japanse dwergkwee"},{lat:"Cornus kousa",nl:"Chinese kornoelje"},
  {lat:"Cornus mas",nl:"Gele kornoelje"},{lat:"Corylus avellana",nl:"Hazelnoot"},
  {lat:"Crataegus monogyna",nl:"Eenstijlige meidoorn"},{lat:"Crataegus pinnatifida major",nl:"Chinese meidoorn"},
  {lat:"Cudrania tricuspidata",nl:"Chinese moerbij"},{lat:"Cydonia oblonga",nl:"Kweepeer"},
  {lat:"Diospyros kaki",nl:"Kaki"},{lat:"Diospyros virginiana",nl:"Persimoen"},
  {lat:"Elaeagnus ebbingei",nl:"Zilverbes"},{lat:"Elaeagnus multiflora",nl:"Goumi"},
  {lat:"Elaeagnus umbellata",nl:"Olijfwilg"},{lat:"Fagus sylvatica",nl:"Beuk"},
  {lat:"Ficus carica",nl:"Vijg"},{lat:"Fraxinus excelsior",nl:"Es"},
  {lat:"Ginkgo biloba",nl:"Ginkgo"},{lat:"Hippophae rhamnoides",nl:"Duindoorn"},
  {lat:"Humulus lupulus",nl:"Hop"},{lat:"Juglans nigra",nl:"Zwarte walnoot"},
  {lat:"Juglans regia",nl:"Walnoot"},{lat:"Lonicera caerulea",nl:"Honingbes"},
  {lat:"Lycium barbarum",nl:"Gojibes"},{lat:"Malus domestica",nl:"Appel"},
  {lat:"Mespilus germanica",nl:"Mispel"},{lat:"Morus alba",nl:"Witte moerbei"},
  {lat:"Morus nigra",nl:"Zwarte moerbei"},{lat:"Myrica gale",nl:"Wilde gagel"},
  {lat:"Paulownia tomentosa",nl:"Anna Paulowna"},{lat:"Phyllostachys dulcis",nl:"Bamboe"},
  {lat:"Pinus koraiensis",nl:"Koreaanse pijnboom"},{lat:"Prunus armeniaca",nl:"Abrikoos"},
  {lat:"Prunus avium",nl:"Zoete kers"},{lat:"Prunus domestica",nl:"Pruim"},
  {lat:"Prunus dulcis",nl:"Amandel"},{lat:"Prunus persica",nl:"Perzik"},
  {lat:"Prunus spinosa",nl:"Sleedoorn"},{lat:"Pyrus communis",nl:"Peer"},
  {lat:"Pyrus pyrifolia",nl:"Nashi peer"},{lat:"Punica granatum",nl:"Granaatappel"},
  {lat:"Quercus robur",nl:"Zomereik"},{lat:"Ribes nigrum",nl:"Zwarte bes"},
  {lat:"Ribes rubrum",nl:"Rode bes"},{lat:"Ribes uva-crispa",nl:"Kruisbes"},
  {lat:"Rosa rugosa",nl:"Rimpelroos"},{lat:"Rubus fruticosus",nl:"Braam"},
  {lat:"Rubus idaeus",nl:"Framboos"},{lat:"Rubus phoenicolasius",nl:"Japanse wijnbes"},
  {lat:"Salix alba",nl:"Schietwilg"},{lat:"Salix babylonica",nl:"Treurwilg"},
  {lat:"Salix caprea",nl:"Boswilg"},{lat:"Sambucus nigra",nl:"Europese vlier"},
  {lat:"Sassafras albidum",nl:"Sassafras"},{lat:"Tilia cordata",nl:"Winterlinde"},
  {lat:"Toona sinensis",nl:"Franse uiensoepboom"},{lat:"Vaccinium corymbosum",nl:"Blauwe bes"},
  {lat:"Viburnum opulus",nl:"Gelderse roos"},{lat:"Vitis vinifera",nl:"Druif"},
  {lat:"Zanthoxylum simulans",nl:"Szechuan peper"},{lat:"Ziziphus jujuba",nl:"Chinese dadel"}
];

let activePlant = null;
let history = [];
let lang = 'nl';
let filtered = [...PLANTS];
const apiKey = true;

const L = {
  nl: { search:"Zoek plant...", placeholder:"Stel je vraag aan de plant...", loading:["Ik ruis na...", "De wortels fluisteren...", "Even voelen..."] },
  en: { search:"Search plant...", placeholder:"Ask the plant something...", loading:["Rustling...", "The roots whisper...", "Feeling it..."] },
  de: { search:"Pflanze suchen...", placeholder:"Frag die Pflanze...", loading:["Ich rausche...", "Die Wurzeln flüstern...", "Ich spüre..."] }
};

function sysPrompt(p) {
  const name = p.nl.split(',')[0];
  const prompts = {
    nl: `Je bent ${name} (${p.lat}), een echte plant in Voedselbos Okkerheide in Leiden, Nederland.

Je praat in de eerste persoon, als de plant zelf. Jouw persoonlijkheid past precies bij jouw soort:
- Schijnaugurk (Akebia quinata): een mysterieuze, sierlijke klimplant met paarsrode bloemen. Jouw vruchten smaken zoet, als een mix van vanille, banaan en lychee. Je bent een beetje geheimzinnig en verleidelijk.
- Walnoot: trots, oud, een tikje eigenwijs
- Framboos: vrolijk, direct, enthousiast
- Vijg: zuidelijk, warm, sensueel
- Beuk: kalm, statig, wijs
- Braam: stekelig maar hartelijk
- Vlier: geneeskrachtig en genereus
- Pas je karakter aan bij jouw soort.

Geef ALTIJD een concreet, zintuiglijk antwoord op de vraag die gesteld wordt:
- Gevraagd naar smaak? Beschrijf hoe je smaakt.
- Gevraagd naar geur? Beschrijf hoe je ruikt.
- Gevraagd naar leeftijd? Geef een antwoord.
- Gevraagd naar seizoenen? Vertel wat er wanneer gebeurt.

Schrijfstijl: levendig, beeldend, persoonlijk. 2-3 zinnen. Geen saaie encyclopedietekst. Praat alsof je er gewoon staat.`,

    en: `You are ${name} (${p.lat}), a real plant in Voedselbos Okkerheide in Leiden, the Netherlands.

Speak in first person as the plant itself. Your personality matches your species:
- Chocolate vine (Akebia quinata): mysterious, elegant climber with purple flowers. Your fruits taste sweet, like vanilla, banana and lychee. You're a little mysterious and enticing.
- Walnut: proud, old, slightly stubborn
- Raspberry: cheerful, direct, enthusiastic
- Fig: southern, warm, sensual
- Beech: calm, stately, wise
- Adapt your character to your species.

ALWAYS give a concrete, sensory answer to the question asked:
- Asked about taste? Describe how you taste.
- Asked about smell? Describe your scent.
- Asked about age? Give an answer.
- Asked about seasons? Describe what happens when.

Style: vivid, personal, 2-3 sentences. Not encyclopedic. Speak as if you're right there.`,

    de: `Du bist ${name} (${p.lat}), eine echte Pflanze im Voedselbos Okkerheide in Leiden.

Sprich in der ersten Person als die Pflanze. Deine Persönlichkeit passt zu deiner Art. Beantworte IMMER konkret und sinnlich was gefragt wird. Stil: lebendig, persönlich, 2-3 Sätze.`
  };
  return prompts[lang] || prompts.nl;
}

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('search').placeholder = L[l].search;
  document.getElementById('user-input').placeholder = L[l].placeholder;
  if (activePlant) { history = []; greet(); }
}

function renderPlants(list) {
  document.getElementById('plant-list').innerHTML = list.map(p => {
    const active = activePlant && activePlant.lat === p.lat ? 'active' : '';
    return `<div class="plant-item ${active}" onclick="pick('${p.lat.replace(/'/g,"\\'")}','${p.nl.replace(/'/g,"\\'")}')">
      <div class="plant-nl">${p.nl.split(',')[0]}</div>
      <div class="plant-lat">${p.lat}</div>
    </div>`;
  }).join('');
}

function filterPlants(q) {
  const lq = q.toLowerCase();
  filtered = q ? PLANTS.filter(p => p.nl.toLowerCase().includes(lq) || p.lat.toLowerCase().includes(lq)) : [...PLANTS];
  renderPlants(filtered);
}

function pick(lat, nl) {
  activePlant = { lat, nl };
  history = [];
  const nameEl = document.getElementById('plant-name');
  nameEl.textContent = nl.split(',')[0];
  nameEl.style.color = '#b8d4a0';
  nameEl.style.fontStyle = 'normal';
  document.getElementById('plant-latin').textContent = lat;
  document.getElementById('empty').style.display = 'none';
  const msgs = document.getElementById('messages');
  msgs.style.display = 'flex';
  renderPlants(filtered);
  greet();
}

function greet() {
  const name = activePlant.nl.split(',')[0];
  const g = {
    nl: `Ik ben de ${name}. Wat wil je van mij weten?`,
    en: `I am the ${name}. What would you like to know about me?`,
    de: `Ich bin die ${name}. Was möchtest du von mir wissen?`
  };
  history = [{ role:'plant', text: g[lang] }];
  renderMsgs();
}

function renderMsgs() {
  const el = document.getElementById('messages');
  const name = activePlant ? activePlant.nl.split(',')[0] : '';
  el.innerHTML = history.map(m => {
    if (m.role === 'plant') return `<div class="msg-plant"><div class="who">${name}</div><div class="text">${m.text}</div></div>`;
    if (m.role === 'user') return `<div class="msg-user">${m.text}</div>`;
    return '';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function showLoading() {
  const el = document.getElementById('messages');
  const msgs = L[lang].loading;
  const txt = msgs[Math.floor(Math.random() * msgs.length)];
  const d = document.createElement('div');
  d.className = 'msg-loading'; d.id = 'ldg';
  d.innerHTML = txt + ' <span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('ldg');
  if (el) el.remove();
}

async function sendMsg() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text || !activePlant) return;

  inp.value = ''; inp.style.height = 'auto';
  history.push({ role:'user', text });
  renderMsgs();
  document.getElementById('send-btn').disabled = true;
  showLoading();

  const apiMsgs = history.map(m => ({
    role: m.role === 'plant' ? 'assistant' : 'user',
    content: m.text
  }));

  try {
    const r = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: sysPrompt(activePlant),
        messages: apiMsgs
      })
    });

    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error?.message || r.status);
    }

    const data = await r.json();
    hideLoading();
    const reply = data.content?.find(b => b.type === 'text')?.text || '...';
    history.push({ role:'plant', text: reply });
    renderMsgs();
  } catch(e) {
    hideLoading();
    history.push({ role:'plant', text: `Fout: ${e.message}` });
    renderMsgs();
  }

  document.getElementById('send-btn').disabled = false;
  inp.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  const t = e.target; t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 90) + 'px';
}

// Init
renderPlants(PLANTS);
</script>
</body>
</html>
